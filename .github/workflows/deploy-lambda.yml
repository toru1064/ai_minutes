name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda_function.py'
      - 'demo_access.py'
      - 'dynamodb_service.py'
      - 'project_service.py'
      - 'task_service.py'
      - 'attachment_service.py'
      - 'user_service.py'
      - 'bedrock_service.py'
      - 'requirements.txt'
      - 'scripts/prepare_requirements.py'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-lambda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Prepare requirements for pip
        run: python scripts/prepare_requirements.py requirements.txt "${RUNNER_TEMP}/requirements.txt"
      - name: Install test dependencies
        run: python -m pip install -r "${RUNNER_TEMP}/requirements.txt"
      - name: Check Python syntax
        run: python -m compileall -q -f -x '(^|/)(node_modules|dist|venv|\.venv)/' .
      - name: Test Lambda
        run: python -m unittest discover -v
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          zip_path="${RUNNER_TEMP}/lambda-deployment.zip"
          python -m pip install --requirement "${RUNNER_TEMP}/requirements.txt" --target "${package_dir}"
          cp lambda_function.py demo_access.py dynamodb_service.py project_service.py \
            task_service.py attachment_service.py user_service.py bedrock_service.py "${package_dir}/"
          (cd "${package_dir}" && zip -q -r "${zip_path}" .)
          test "$(unzip -Z1 "${zip_path}" | grep -c '^lambda_function.py$')" -eq 1
      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file "fileb://${RUNNER_TEMP}/lambda-deployment.zip" \
            --region "${AWS_REGION}" \
            --no-cli-pager
      - name: Wait for Lambda and verify status
        shell: bash
        run: |
          set -euo pipefail
          aws lambda wait function-updated-v2 \
            --function-name "${LAMBDA_FUNCTION_NAME}" --region "${AWS_REGION}"
          read -r update_status state <<<"$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" --region "${AWS_REGION}" \
            --query '[LastUpdateStatus,State]' --output text)"
          printf 'LastUpdateStatus=%s State=%s\n' "${update_status}" "${state}"
          test "${update_status}" = Successful
          test "${state}" = Active
