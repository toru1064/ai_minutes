name: Pull request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          find frontend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check vite.config.js
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Prepare requirements for pip
        run: python scripts/prepare_requirements.py requirements.txt "${RUNNER_TEMP}/requirements.txt"
      - name: Install Python dependencies
        run: python -m pip install -r "${RUNNER_TEMP}/requirements.txt"
      - name: Check Python syntax
        run: python -m compileall -q -f -x '(^|/)(node_modules|dist|venv|\.venv)/' .
      - name: Test Lambda
        run: python -m unittest discover -v
