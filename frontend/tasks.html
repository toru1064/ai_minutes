<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケット一覧</title><link rel="stylesheet" href="style.css"><script type="module" src="tasks.js"></script></head><body class="list-page"><header class="app-header"><div class="app-title">AIプロジェクト管理</div><div class="header-auth"><span id="user-status">ログイン状態を確認しています...</span><button id="login-button" hidden>ログイン</button><button id="logout-button" hidden>ログアウト</button></div></header><div class="app-layout"><aside class="sidebar"><nav class="sidebar-menu"><a href="projects.html">プロジェクト</a><a href="index.html">議事録一覧</a><a href="register.html">議事録を登録</a><a href="tasks.html" class="active">チケット一覧</a><a href="task_register.html">チケットを登録</a></nav></aside><main class="main-content"><section id="tasks-section" hidden><div class="page-heading"><div><h1>チケット一覧</h1><p>正式に管理するTODOを確認します。</p></div><a class="primary-link" href="task_register.html">＋ チケットを登録</a></div><section class="task-filters" aria-label="チケットの検索条件"><label>フリーワード<input id="task-query" placeholder="番号、件名、説明など"></label><label>プロジェクト<select id="project-filter"><option value="">すべて</option></select></label><label>関連議事録<select id="minutes-filter"><option value="">すべて</option></select></label><label>担当者<select id="assignee-filter"><option value="">すべて</option></select></label><label>状態<select id="status-filter"><option value="">すべて</option><option value="not_started">未着手</option><option value="in_progress">進行中</option><option value="completed">完了</option></select></label><label>優先度<select id="priority-filter"><option value="">すべて</option><option value="low">低</option><option value="normal">通常</option><option value="high">高</option><option value="urgent">緊急</option></select></label><label>期限<select id="due-filter"><option value="">すべて</option><option value="overdue">期限切れ</option><option value="today">今日まで</option><option value="week">今後7日</option><option value="none">期限なし</option></select></label><label>並べ替え<select id="sort"><option value="number_asc">チケット番号：昇順</option><option value="number_desc">チケット番号：降順</option><option value="due_asc">期限：近い順</option><option value="due_desc">期限：遠い順</option><option value="priority">優先度</option><option value="status">状態</option></select></label><button type="button" id="clear-filters">条件をクリア</button></section><p id="list-message">読み込んでいます...</p><div class="table-wrapper"><table class="minutes-table"><thead><tr><th>#</th><th>プロジェクト</th><th>関連議事録</th><th>件名</th><th>担当者</th><th>期限</th><th>状態</th><th>優先度</th><th>詳細</th></tr></thead><tbody id="tasks-table-body"></tbody></table></div></section></main></div></body></html>
