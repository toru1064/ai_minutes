<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケット詳細</title><link rel="stylesheet" href="style.css"><script type="module" src="task_detail.js"></script></head><body class="detail-page"><header class="app-header"><div class="app-title">AIプロジェクト管理</div><div class="header-auth"><span id="user-status">ログイン状態を確認しています...</span><button id="logout-button">ログアウト</button></div></header><div class="app-layout"><aside class="sidebar"><nav class="sidebar-menu"><a href="projects.html">プロジェクト</a><a href="index.html">議事録一覧</a><a href="register.html">議事録を登録</a><a class="active" href="tasks.html">チケット一覧</a><a href="task_register.html">チケットを登録</a></nav></aside><main class="main-content"><div class="page-heading"><div><h1>チケット詳細</h1><p>チケット番号：<span id="task-number"></span></p></div></div><form id="task-form" class="form-card" hidden><div class="form-grid"><div><label for="minutes-id">関連議事録 *</label><select id="minutes-id" required><option value="">関連議事録：未設定</option></select></div><div><label for="title">件名 *</label><input id="title" required></div><div><label for="assignee">担当者 *</label><input id="assignee" required></div><div><label for="due-date">期限 *</label><input id="due-date" type="date" required></div><div><label for="status">状態</label><select id="status"><option value="not_started">未着手</option><option value="in_progress">進行中</option><option value="completed">完了</option></select></div><div><label for="priority">優先度</label><select id="priority"><option value="low">低</option><option value="normal">通常</option><option value="high">高</option><option value="urgent">緊急</option></select></div></div><label for="description">説明</label><textarea id="description"></textarea><label for="resolution">処置結果</label><textarea id="resolution"></textarea><button id="save-button">変更を保存</button></form><p id="status-message">読み込んでいます...</p></main></div></body></html>
