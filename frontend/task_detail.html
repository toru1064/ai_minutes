<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケット詳細</title><link rel="stylesheet" href="style.css"><script type="module" src="task_detail.js"></script></head><body class="detail-page"><header class="app-header"><div class="app-title">AIプロジェクト管理</div><div class="header-auth"><span id="user-status">ログイン状態を確認しています...</span><button id="logout-button">ログアウト</button></div></header><div class="app-layout"><aside class="sidebar"><nav class="sidebar-menu">
                <a href="dashboard.html">ダッシュボード</a>
                <a href="tasks.html?assignee=me">自分のチケット</a><a href="projects.html">プロジェクト</a><a href="index.html">議事録一覧</a><a href="register.html">議事録を登録</a><a class="active" href="tasks.html">チケット一覧</a><a href="task_register.html">チケットを登録</a></nav></aside><main class="main-content"><div class="page-heading detail-heading"><div class="detail-title"><h1 class="page-title"><span id="task-title">チケット詳細</span> <span id="task-number" class="title-number"></span> <span id="task-title-status" class="status-badge"></span></h1></div></div><form id="task-form" class="form-card" hidden><div class="form-grid"><div><label for="minutes-id">関連議事録 *</label><input id="minutes-search" list="minutes-options" autocomplete="off" placeholder="未設定（番号、会議名、プロジェクト名で検索）"><datalist id="minutes-options"></datalist><input id="minutes-id" type="hidden"></div><div><label for="title">件名 *</label><input id="title" required></div><div><label for="assignee">担当者 *</label><select id="assignee" required></select></div><div><label for="due-date">期限 *</label><input id="due-date" type="date" required></div><div><label for="status">状態</label><select id="status"><option value="not_started">未着手</option><option value="in_progress">進行中</option><option value="completed">完了</option></select></div><div><label for="priority">優先度</label><select id="priority"><option value="low">低</option><option value="normal">通常</option><option value="high">高</option><option value="urgent">緊急</option></select></div></div><label for="description">説明</label><textarea id="description"></textarea><label for="resolution">処置結果</label><textarea id="resolution"></textarea><div class="form-actions"><button id="save-button">保存</button><a id="cancel-link" class="secondary-button" href="tasks.html">キャンセル</a></div></form><section id="attachments-panel" class="detail-panel attachments-panel" hidden><div class="attachments-heading"><h2>添付ファイル</h2><label class="action-link attachment-picker">＋ ファイルを添付<input id="attachment-input" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.docx,.xlsx"></label></div><div id="attachment-confirm" class="attachment-confirm" hidden><span id="selected-file"></span><button id="upload-button" type="button" class="compact-button">アップロード</button><button id="cancel-upload-button" type="button" class="secondary-button">キャンセル</button></div><p id="attachment-status" class="attachment-status" role="status"></p><div class="attachment-table-wrap"><table class="attachment-table"><thead><tr><th>ファイル名</th><th>サイズ</th><th>アップロード日時</th><th>アップロード者</th><th>操作</th></tr></thead><tbody id="attachment-list"></tbody></table></div><p id="no-attachments">添付ファイルはありません</p></section><section id="change-history" class="detail-panel"></section><p id="status-message">読み込んでいます...</p></main></div></body></html>
