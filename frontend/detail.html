<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>議事録詳細</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="detail.js"></script>
</head>

<body>
    <main class="container detail-container">
        <a href="index.html">
            ← 議事録一覧へ戻る
        </a>

        <h1 id="meeting-name">議事録詳細</h1>

        <p id="detail-message">
            議事録を読み込んでいます...
        </p>

        <div id="detail-content" hidden>

            <!-- AI議事録 -->
            <section id="ai-section">
                <h2>AI議事録</h2>
                
                <!-- 承認状態と操作ボタン -->
                <div class="status-area">
                    <p>
                        状態：
                        <strong id="detail-status"></strong>
                    </p>

                    <div class="status-buttons">
                        <button
                            type="button"
                            id="request-button"
                            hidden
                        >
                            承認を申請
                        </button>

                        <button
                            type="button"
                            id="approve-button"
                            hidden
                        >
                            承認
                        </button>

                        <button
                            type="button"
                            id="reject-button"
                            hidden
                        >
                            差し戻し
                        </button>
                    </div>

                    <p id="status-message"></p>
                </div>

                <div class="result-card">
                    <h3>会議の要約</h3>
                    <p id="summary"></p>
                </div>

                <div class="result-card">
                    <h3>決定事項</h3>
                    <ul id="decisions"></ul>
                </div>

                <div class="result-card">
                    <h3>TODO</h3>
                    <ul id="todos"></ul>
                </div>

            </section>

            <!-- 会議内容の原文 -->
            <section id="raw-section">
                <div class="section-header">
                    <h2>会議内容（原文）</h2>

                    <button
                        type="button"
                        id="download-button"
                    >
                        TXTで保存
                    </button>
                </div>

                <pre id="raw-minutes"></pre>
            </section>
        </div>
    </main>
</body>
</html>
