<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>議事録詳細</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="detail.js"></script>
</head>

<body class="detail-page">
    <!-- 上部ヘッダー -->
    <header class="app-header">
        <div class="app-title">
            AIプロジェクト管理
        </div>

        <div class="header-auth">
            <span id="detail-user-status">
                ログイン状態を確認しています...
            </span>

            <button
                type="button"
                id="detail-logout-button"
            >
                ログアウト
            </button>
        </div>
    </header>

    <div class="app-layout">
        <!-- 左メニュー -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="projects.html">
                    プロジェクト
                </a>

                <a
                    href="index.html"
                    class="active"
                >
                    議事録一覧
                </a>

                <a href="register.html">
                    議事録を登録
                </a>
            </nav>
        </aside>

        <!-- メイン画面 -->
        <main class="main-content">
            <div class="page-heading detail-heading">
                <div>
                    <h1 id="meeting-name">
                        議事録詳細
                    </h1>

                    <p id="meeting-project"></p>
                </div>
            </div>

            <p id="detail-message">
                議事録を読み込んでいます...
            </p>

            <div id="detail-content" hidden>
                <!-- 承認状態と操作 -->
                <section
                    id="approval-area"
                    class="workflow-bar"
                >
                    <div class="workflow-status">
                        <span>現在の状態</span>

                        <strong
                            id="detail-status"
                            class="status-badge"
                        ></strong>
                    </div>

                    <div class="status-buttons">
                        <button
                            type="button"
                            id="request-button"
                            hidden
                        >
                            承認を申請
                        </button>

                        <button
                            type="button"
                            id="approve-button"
                            hidden
                        >
                            承認
                        </button>

                        <button
                            type="button"
                            id="reject-button"
                            hidden
                        >
                            差し戻し
                        </button>
                    </div>

                    <p id="status-message"></p>
                </section>

                <!-- AI議事録 -->
                <section
                    id="ai-section"
                    class="detail-panel"
                >
                    <div class="panel-heading">
                        <h2>AI議事録</h2>

                        <p>
                            AIが会議内容を整理した結果です。
                        </p>
                    </div>

                    <div class="result-card">
                        <h3>会議の要約</h3>
                        <p id="summary"></p>
                    </div>

                    <div class="result-card">
                        <h3>決定事項</h3>
                        <ul id="decisions"></ul>
                    </div>

                    <div class="result-card">
                        <h3>TODO</h3>
                        <ul id="todos"></ul>
                    </div>
                </section>

                <!-- 会議内容の原文 -->
                <section
                    id="raw-section"
                    class="detail-panel"
                >
                    <div class="panel-heading detail-panel-heading">
                        <div>
                            <h2>会議内容（原文）</h2>

                            <p>
                                登録時に入力された会議内容です。
                            </p>
                        </div>

                        <button
                            type="button"
                            id="download-button"
                        >
                            TXTで保存
                        </button>
                    </div>

                    <pre id="raw-minutes"></pre>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
