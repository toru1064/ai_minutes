<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>議事録一覧</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="list.js"></script>
</head>

<body class="list-page">
    <!-- 上部ヘッダー -->
    <header class="app-header">
        <div class="app-title">
            AIプロジェクト管理
        </div>

        <div class="header-auth">
            <span id="user-status">
                ログイン状態を確認しています...
            </span>

            <button
                type="button"
                id="login-button"
                hidden
            >
                ログイン
            </button>

            <button
                type="button"
                id="logout-button"
                hidden
            >
                ログアウト
            </button>
        </div>
    </header>

    <div class="app-layout">
        <!-- 左メニュー -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="projects.html">
                    プロジェクト
                </a>

                <a
                    href="index.html"
                    class="active"
                >
                    議事録一覧
                </a>

                <a href="register.html">
                    議事録を登録
                </a>
                            <a href="tasks.html">チケット一覧</a>
                <a href="task_register.html">チケットを登録</a>
            </nav>
        </aside>

        <!-- メイン画面 -->
        <main class="main-content">
            <section id="minutes-section" hidden>
                <div class="page-heading">
                    <div>
                        <h1>議事録一覧</h1>

                        <p>
                            登録された議事録を確認・管理します。
                        </p>
                    </div>

                    <a
                        href="register.html"
                        class="primary-link"
                    >
                        ＋ 議事録を登録
                    </a>
                </div>

                <!-- 検索と状態の絞り込み -->
                <section class="filter-panel">
                    <input
                        type="search"
                        id="minutes-search"
                        placeholder="会議名・担当者・承認者を検索"
                    >

                    <div class="status-tabs">
                        <button
                            type="button"
                            class="status-tab active"
                            data-status="all"
                        >
                            すべて
                        </button>

                        <button
                            type="button"
                            class="status-tab"
                            data-status="draft"
                        >
                            下書き
                        </button>

                        <button
                            type="button"
                            class="status-tab"
                            data-status="pending"
                        >
                            承認待ち
                        </button>

                        <button
                            type="button"
                            class="status-tab"
                            data-status="approved"
                        >
                            承認済み
                        </button>

                        <button
                            type="button"
                            class="status-tab"
                            data-status="rejected"
                        >
                            差し戻し
                        </button>
                    </div>
                </section>

                <p id="list-message">
                    議事録を読み込んでいます...
                </p>

                <!-- 議事録一覧 -->
                <div class="table-wrapper">
                    <table class="minutes-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>プロジェクト</th>
                                <th>会議名</th>
                                <th>会議日</th>
                                <th>担当者</th>
                                <th>承認者</th>
                                <th>更新日</th>
                                <th>状態</th>
                                <th>チケット進捗</th>
                                <th>操作</th>
                            </tr>
                        </thead>

                        <tbody
                            id="minutes-table-body"
                        ></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
