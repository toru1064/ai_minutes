<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>議事録一覧</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="list.js"></script>
</head>

<body>
    <main class="container list-container">
        <h1>AI議事録</h1>

        <!-- ログイン状態 -->
        <section class="auth-area">
            <p id="user-status">
                ログイン状態を確認しています...
            </p>

            <button type="button" id="login-button" hidden>
                ログイン
            </button>

            <button type="button" id="logout-button" hidden>
                ログアウト
            </button>
        </section>

        <!-- 議事録一覧 -->
        <section id="minutes-section" hidden>
            <div class="list-header">
                <h2>議事録一覧</h2>

                <a
                    href="register.html"
                    class="button-link"
                >
                    ＋ 議事録を登録
                </a>
            </div>

            <p id="list-message">
                議事録を読み込んでいます...
            </p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>会議名</th>
                            <th>会議日</th>
                            <th>担当者</th>
                            <th>承認者</th>
                            <th>更新日</th>
                            <th>状態</th>
                            <th>原文</th>
                            <th>AI議事録</th>
                        </tr>
                    </thead>

                    <!-- JavaScriptで一覧を追加 -->
                    <tbody id="minutes-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
