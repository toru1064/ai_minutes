<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクト詳細</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="project_detail.js"></script>
</head>
<body class="detail-page project-page">
    <header class="app-header">
        <div class="app-title">AIプロジェクト管理</div>
        <div class="header-auth">
            <span id="user-status">ログイン状態を確認しています...</span>
            <button type="button" id="logout-button">ログアウト</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="projects.html" class="active">プロジェクト</a>
                <a href="index.html">議事録一覧</a>
                <a href="register.html">議事録を登録</a>
                            <a href="tasks.html">チケット一覧</a>
                <a href="task_register.html">チケットを登録</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-heading">
                <div>
                    <h1 id="project-name">プロジェクト詳細</h1>
                    <p id="project-number"></p>
                </div>
                <div class="heading-actions"><button id="edit-button" class="action-link">✎ 編集</button><a id="minutes-register-link" href="register.html" class="primary-link">＋ 議事録を登録</a></div>
            </div>

            <p id="detail-message">プロジェクトを読み込んでいます...</p>

            <div id="detail-content" hidden>
                <form id="project-edit-form" class="form-card" hidden><div class="form-grid"><label>プロジェクト名 *<input id="edit-name" required></label><label>責任者 *<input id="edit-manager" required></label><label>状態<select id="edit-status"><option value="active">進行中</option><option value="on_hold">保留</option><option value="completed">完了</option></select></label><label>開始日 *<input id="edit-start" type="date" required></label><label>終了予定日<input id="edit-end" type="date"></label></div><label>概要<textarea id="edit-description"></textarea></label><div class="form-actions"><button id="save-button">保存</button><button type="button" id="cancel-button" class="secondary-button">キャンセル</button></div></form>
                <section class="detail-panel project-summary-panel">
                    <div class="project-summary-grid">
                        <div><span>状態</span><strong id="project-status"></strong></div>
                        <div><span>責任者</span><strong id="project-manager"></strong></div>
                        <div><span>開始日</span><strong id="project-start-date"></strong></div>
                        <div><span>終了予定日</span><strong id="project-end-date"></strong></div>
                    </div>

                    <div class="project-description-block">
                        <h2>プロジェクト概要</h2>
                        <p id="project-description"></p>
                    </div>
                </section>

                <section class="related-minutes-panel">
                    <div class="panel-heading">
                        <h2>関連する議事録</h2>
                        <p>このプロジェクトに登録されている議事録です。</p>
                    </div>

                    <p id="minutes-message"></p>
                    <div class="table-wrapper">
                        <table class="minutes-table related-minutes-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>会議名</th>
                                    <th>会議日</th>
                                    <th>担当者</th>
                                    <th>承認状態</th>
                                </tr>
                            </thead>
                            <tbody id="minutes-table-body"></tbody>
                        </table>
                    </div>
                </section>
                <section id="change-history" class="detail-panel"></section>
            </div>
        </main>
    </div>
</body>
</html>
