<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクトを登録</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="project_register.js"></script>
</head>
<body class="register-page project-page">
    <header class="app-header">
        <div class="app-title">AIプロジェクト管理</div>
        <div class="header-auth">
            <span id="user-status">ログイン状態を確認しています...</span>
            <button type="button" id="login-button" hidden>ログイン</button>
            <button type="button" id="logout-button" hidden>ログアウト</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="projects.html" class="active">プロジェクト</a>
                <a href="index.html">議事録一覧</a>
                <a href="register.html">議事録を登録</a>
                            <a href="tasks.html">チケット一覧</a>
                <a href="task_register.html">チケットを登録</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-heading">
                <div>
                    <h1>プロジェクトを登録</h1>
                    <p>議事録や今後のチケットをまとめる単位を作成します。</p>
                </div>
            </div>

            <form id="project-form" class="register-form" hidden>
                <section class="form-panel">
                    <div class="panel-heading">
                        <h2>プロジェクト情報</h2>
                        <p>プロジェクトの基本情報を入力してください。</p>
                    </div>

                    <div class="form-grid">
                        <div class="form-field full-width-field">
                            <label for="project-name">プロジェクト名</label>
                            <input type="text" id="project-name" placeholder="例：AI議事録アプリ開発" required>
                        </div>

                        <div class="form-field">
                            <label for="manager">責任者</label>
                            <input type="text" id="manager" placeholder="例：中野" required>
                        </div>

                        <div class="form-field">
                            <label for="project-status">状態</label>
                            <select id="project-status">
                                <option value="active">進行中</option>
                                <option value="on_hold">保留</option>
                                <option value="completed">完了</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="start-date">開始日</label>
                            <input type="date" id="start-date" required>
                        </div>

                        <div class="form-field">
                            <label for="end-date">終了予定日</label>
                            <input type="date" id="end-date">
                        </div>

                        <div class="form-field full-width-field">
                            <label for="description">説明</label>
                            <textarea id="description" class="project-description" placeholder="プロジェクトの目的や概要を入力してください"></textarea>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <a href="projects.html" class="secondary-link">キャンセル</a>
                    <button type="submit" id="register-button">＋ プロジェクトを登録</button>
                </div>
            </form>

            <p id="status-message"></p>
        </main>
    </div>
</body>
</html>
