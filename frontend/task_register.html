<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケットを登録</title><link rel="stylesheet" href="style.css"><script type="module" src="task_register.js"></script></head><body class="register-page"><header class="app-header"><div class="app-title">AIプロジェクト管理</div><div class="header-auth"><span id="user-status">ログイン状態を確認しています...</span><button id="login-button" hidden>ログイン</button><button id="logout-button" hidden>ログアウト</button></div></header><div class="app-layout"><aside class="sidebar"><nav class="sidebar-menu"><a href="projects.html">プロジェクト</a><a href="index.html">議事録一覧</a><a href="register.html">議事録を登録</a><a href="tasks.html">チケット一覧</a><a class="active" href="task_register.html">チケットを登録</a></nav></aside><main class="main-content"><div class="page-heading"><div><h1>チケットを登録</h1><p>議事録に関連付けてチケットを登録します。</p></div></div><form id="task-form" class="form-card" hidden><div class="form-grid"><div><label for="minutes-id">関連議事録 *</label><select id="minutes-id" required><option value="">選択してください</option></select></div><div><label for="title">件名 *</label><input id="title" required></div><div><label for="assignee">担当者 *</label><input id="assignee" required></div><div><label for="due-date">期限 *</label><input id="due-date" type="date" required></div><div><label for="priority">優先度</label><select id="priority"><option value="low">低</option><option value="normal" selected>通常</option><option value="high">高</option><option value="urgent">緊急</option></select></div></div><label for="description">説明</label><textarea id="description"></textarea><button id="register-button">登録する</button></form><p id="status-message"></p></main></div></body></html>
