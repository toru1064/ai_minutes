<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>議事録を登録</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="register.js"></script>
</head>

<body class="register-page">
    <!-- 上部ヘッダー -->
    <header class="app-header">
        <div class="app-title">
            AIプロジェクト管理
        </div>

        <div class="header-auth">
            <span id="user-status">
                ログイン状態を確認しています...
            </span>

            <button
                type="button"
                id="login-button"
                hidden
            >
                ログイン
            </button>

            <button
                type="button"
                id="logout-button"
                hidden
            >
                ログアウト
            </button>
        </div>
    </header>

    <div class="app-layout">
        <!-- 左メニュー -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="projects.html">
                    プロジェクト
                </a>

                <a href="index.html">
                    議事録一覧
                </a>

                <a
                    href="register.html"
                    class="active"
                >
                    議事録を登録
                </a>
                            <a href="tasks.html">チケット一覧</a>
                <a href="task_register.html">チケットを登録</a>
            </nav>
        </aside>

        <!-- メイン画面 -->
        <main class="main-content">
            <div class="page-heading">
                <div>
                    <h1>議事録を登録</h1>

                    <p>
                        会議情報と原文を登録します。
                        AI議事録は登録後に作成できます。
                    </p>
                </div>
            </div>

            <!-- 会議内容の入力フォーム -->
            <form
                id="minutes-form"
                class="register-form"
            >
                <!-- 基本情報 -->
                <section class="form-panel">
                    <div class="panel-heading">
                        <h2>基本情報</h2>
                        <p>会議と承認に必要な情報を入力します。</p>
                    </div>

                    <div class="form-grid">
                        <div class="form-field full-width-field">
                            <label for="project-id">
                                プロジェクト
                            </label>

                            <input id="project-search" list="project-options" autocomplete="off" placeholder="番号、プロジェクト名、責任者で検索" required>
                            <datalist id="project-options"></datalist>
                            <input id="project-id" type="hidden">

                            <small class="field-help">
                                プロジェクトがない場合は、先に
                                <a href="project_register.html">プロジェクトを登録</a>
                                してください。
                            </small>
                        </div>

                        <div class="form-field">
                            <label for="meeting-name">
                                会議名
                            </label>

                            <input
                                type="text"
                                id="meeting-name"
                                placeholder="例：開発会議"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="meeting-date">
                                会議日
                            </label>

                            <input
                                type="date"
                                id="meeting-date"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="assignee">
                                議事録担当者
                            </label>

                            <input
                                type="text"
                                id="assignee"
                                placeholder="例：田中"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="approver">
                                承認者
                            </label>

                            <input
                                type="text"
                                id="approver"
                                placeholder="例：佐藤"
                                required
                            >
                        </div>
                    </div>
                </section>

                <!-- 会議内容 -->
                <section class="form-panel">
                    <div class="panel-heading">
                        <h2>会議内容</h2>

                        <p>
                            直接入力するか、TXTファイルから
                            読み込んでください。
                        </p>
                    </div>

                    <div class="file-upload-area">
                        <label for="meeting-file">
                            TXTファイルを選択
                        </label>

                        <input
                            type="file"
                            id="meeting-file"
                            accept=".txt,text/plain"
                        >
                    </div>

                    <textarea
                        id="meeting-text"
                        placeholder="会議内容を入力してください"
                        required
                    ></textarea>
                </section>

                <div class="form-actions">
                    <button
                        type="submit"
                        id="register-button"
                    >
                        ＋ 議事録を登録
                    </button>
                </div>
            </form>

            <!-- 処理中やエラーのメッセージ -->
            <p id="status-message"></p>

        </main>
    </div>
</body>
</html>
