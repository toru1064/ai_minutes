<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="dashboard.js"></script>
</head>
<body class="dashboard-page">
    <header class="app-header">
        <div class="app-title">AIプロジェクト管理</div>
        <div class="header-auth">
            <span id="user-status">ログイン状態を確認しています...</span>
            <button id="logout-button">ログアウト</button>
        </div>
    </header>
    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-menu" aria-label="メインメニュー">
                <a class="active" href="dashboard.html" aria-current="page">ダッシュボード</a>
                <a href="tasks.html?assignee=me">自分のチケット</a>
                <a href="projects.html">プロジェクト</a>
                <a href="index.html">議事録一覧</a>
                <a href="register.html">議事録を登録</a>
                <a href="tasks.html">チケット一覧</a>
                <a href="task_register.html">チケットを登録</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1>ダッシュボード</h1>
            <div class="dashboard-grid">
                <section class="dashboard-panel dashboard-panel-tasks" aria-labelledby="my-tasks-heading">
                    <div class="panel-heading">
                        <h2 id="my-tasks-heading">自分のチケット</h2>
                        <a class="dashboard-more-link" href="tasks.html?assignee=me">すべて見る</a>
                    </div>
                    <div id="task-counts" class="count-strip" aria-label="チケット件数"></div>
                    <div id="my-tasks">読み込み中...</div>
                </section>
                <section class="dashboard-panel dashboard-panel-pending" aria-labelledby="pending-minutes-heading">
                    <h2 id="pending-minutes-heading">承認待ちの議事録</h2>
                    <div id="pending-minutes">読み込み中...</div>
                </section>
                <section class="dashboard-panel" aria-labelledby="recent-minutes-heading">
                    <h2 id="recent-minutes-heading">最近更新された議事録</h2>
                    <div id="recent-minutes">読み込み中...</div>
                </section>
                <section class="dashboard-panel" aria-labelledby="recent-tasks-heading">
                    <h2 id="recent-tasks-heading">最近更新されたチケット</h2>
                    <div id="recent-tasks">読み込み中...</div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
